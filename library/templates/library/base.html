<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Библиотека книг{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'library/css/style.css' %}">
</head>
<body>
    <header>
        <div class="container">
            <h1>📚 Библиотека книг</h1>
            <nav>
                <a href="{% url 'index' %}">➕ Добавить книгу</a>
                <a href="{% url 'upload' %}">📤 Загрузить файл</a>
                <a href="{% url 'files' %}">📁 Список файлов</a>
                <a href="{% url 'db_list' %}">🗄️ База данных</a>
            </nav>
        </div>
    </header>

    {% if messages %}
    <div class="container messages">
        {% for message in messages %}
        <div class="message message-{{ message.tags }}">
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 Библиотека книг. Абдиянова Арина.</p>
        </div>
    </footer>
</body>
</html>
